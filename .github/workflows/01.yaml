name: first workflow 

on: 
 workflow_dispatch:
  inputs:
    dry-run:
      type: boolean
      description: skip deployment 
      default: false
      required: false 
    version-pick:
      type: choice 
      description: pick the version to deploy
      required: true 
      options:
        - v1
        - v2
      default: v2
    platform:
      type: environment 
      description: chose the environment to deploy 
    
jobs:
  build:
    runs-on: ubuntu-latest 
    outputs:
      name: ${{ steps.step1.outputs.message }}
    steps:
      - id: step1
        run: echo "message=hello da rajesh" >> "$GITHUB_OUTPUT"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo " the message from build step is ${{ needs.build.outputs.name }} "
  version-print:
    runs-on: ubuntu-latest
    needs: build 
    steps:
     - run: echo " the verion we are building is ${{ inputs.version-pick }}"
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !inputs.dry-run }}
    steps:
      - run: echo "deploying to prod....in ${{inputs.platform }}"